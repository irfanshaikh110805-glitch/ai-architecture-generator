<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hard Drop Shadow -->
  <rect x="12" y="12" width="46" height="46" fill="#000000" />
  
  <!-- Main Badge Container -->
  <rect x="8" y="8" width="46" height="46" fill="#FDF6E3" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />
  
  <!-- Architectural Blocks Grid -->
  <!-- Top Block (Magenta) -->
  <rect x="14" y="14" width="16" height="16" fill="#FF00FF" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter" />
  <circle cx="22" cy="22" r="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />

  <!-- Top Right Block (Lime Green) -->
  <rect x="34" y="14" width="14" height="16" fill="#00FF00" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter" />
  <rect x="39" y="19" width="4" height="6" fill="#000000" />

  <!-- Bottom Left Block (Cyber Yellow) -->
  <rect x="14" y="34" width="16" height="14" fill="#FFE600" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter" />
  <line x1="18" y1="41" x2="26" y2="41" stroke="#000000" stroke-width="2" />

  <!-- Bottom Right Block (Cyber Cyan) -->
  <rect x="34" y="34" width="14" height="14" fill="#00FFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter" />
  <path d="M 37 38 L 45 44" stroke="#000000" stroke-width="2" stroke-linecap="square" />
  
  <!-- Center Node Connector -->
  <circle cx="32" cy="32" r="4.5" fill="#000000" />
  <circle cx="32" cy="32" r="2" fill="#00FF00" />
</svg>