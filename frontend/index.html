<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/jpeg" href="/logo.jpg" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="167x167" href="/logo.jpg" />
    
    <!-- Apple Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArchitechAI" />
    
    <!-- Viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>ArchitechAI — AI-Powered System Design Generator</title>
    <meta name="title" content="ArchitechAI — AI-Powered System Design Generator" />
    <meta name="description" content="Transform your project idea into a complete, production-ready system architecture in seconds using the power of AI. Generate database schemas, APIs, diagrams, and cost estimates instantly." />
    <meta name="keywords" content="AI architecture, system design, database schema, API design, software architecture, project planning, cost estimation" />
    <meta name="author" content="ArchitechAI" />
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/logo.jpg" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ArchitechAI — AI-Powered System Design Generator" />
    <meta property="og:description" content="Transform your project idea into a complete, production-ready system architecture in seconds using AI." />
    <meta property="og:image" content="/logo.jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArchitechAI — AI-Powered System Design Generator" />
    <meta name="twitter:description" content="Transform your project idea into a complete, production-ready system architecture in seconds using AI." />
    <meta name="twitter:image" content="/logo.jpg" />
    
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    
    <!-- Google Fonts: Archivo Black, Syne, Space Grotesk, Space Mono, Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fira+Code:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Inline critical CSS for faster initial render -->
    <style>
      /* Neo-Brutalist Critical CSS */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        background-color: #FDF6E3;
      }
      
      body {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        background-color: #FDF6E3;
        color: #000000;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Neo-Brutalist Loading spinner */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: #FDF6E3;
        z-index: 9999;
      }
      
      .app-loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #000000;
        border-top-color: #FF00FF;
        border-right-color: #00FF00;
        box-shadow: 4px 4px 0px 0px #000000;
        animation: neo-spin 0.8s steps(8) infinite;
      }

      .app-loading-text {
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        background: #00FF00;
        color: #000000;
        padding: 4px 12px;
        border: 2px solid #000000;
        box-shadow: 3px 3px 0px 0px #000000;
      }
      
      @keyframes neo-spin {
        to { transform: rotate(360deg); }
      }
      
      /* Prevent layout shift */
      img, video {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <!-- Loading indicator -->
    <div id="root">
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
        <div class="app-loading-text">LOADING ARCHITECH.AI...</div>
      </div>
    </div>
    
    <!-- Main application script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
